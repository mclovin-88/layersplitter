<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>Layer Splitter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a wireframe desk on graph paper — outlined panels with sticky-note heads (01 ไฟล์ · Preview · 02 Layers · 03 Export · ผลลัพธ์); four columns fold to two, then one */
:root{
  --bg:#f1f1f4; --grid:#e1e1e8; --panel:#ffffff; --stroke:#18181f; --line:#dedee6;
  --fg:#18181f; --muted:#5f5f6e; --hover:#f4f2f9;
  --accent:#9747ff; --accent-ink:#ffffff; --accent-soft:#f0e6ff;
  --n-blue:#a9cfe8; --n-pink:#e8b8df; --n-yellow:#f3d48c; --n-green:#c4d7a1;
  --badge-bg:#ffffff; --badge-fg:#18181f; --chip-bg:#13233f; --chip-fg:#ffffff;
  --warn:#8a4b00; --warn-bg:#fff2dc; --bad:#b4233a; --ok:#1d7a4f;
  --check:#e8e8ee; --check-2:#ffffff;
  --alert:#f25c05; --alert-bg:#fff0e5;   /* limitation warnings: text, badges and preview highlight share this */
  --font-display:"Archivo","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-ui:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --sw:1.5px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1628; --grid:#16243b; --panel:#111e34; --stroke:#e6ecf6; --line:#24344f;
  --fg:#eef2f9; --muted:#9eabc2; --hover:#18294a;
  --accent:#b07cff; --accent-ink:#120a22; --accent-soft:#2a2150;
  --n-blue:#284b66; --n-pink:#58324f; --n-yellow:#5a4720; --n-green:#3b4f2c;
  --chip-bg:#e6ecf6; --chip-fg:#0c1628;
  --warn:#f0b35a; --warn-bg:#33270f; --bad:#ff7a8e; --ok:#5fd39b;
  --check:#1a2a44; --check-2:#132239; --alert:#ff8a3d; --alert-bg:#3a2210; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1628; --grid:#16243b; --panel:#111e34; --stroke:#e6ecf6; --line:#24344f;
  --fg:#eef2f9; --muted:#9eabc2; --hover:#18294a;
  --accent:#b07cff; --accent-ink:#120a22; --accent-soft:#2a2150;
  --n-blue:#284b66; --n-pink:#58324f; --n-yellow:#5a4720; --n-green:#3b4f2c;
  --chip-bg:#e6ecf6; --chip-fg:#0c1628;
  --warn:#f0b35a; --warn-bg:#33270f; --bad:#ff7a8e; --ok:#5fd39b;
  --check:#1a2a44; --check-2:#132239; --alert:#ff8a3d; --alert-bg:#3a2210; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);color:var(--fg);font:14px/1.5 var(--font-ui);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;gap:12px;margin:0 auto 16px;max-width:1500px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);border:var(--sw) solid var(--stroke);display:grid;place-items:center;flex:none;box-shadow:3px 3px 0 var(--stroke)}
.logo svg{width:20px;height:20px}
header h1{font:700 21px/1.1 var(--font-display);margin:0;letter-spacing:-.01em}
header .spacer{flex:1}

.btn{border:var(--sw) solid var(--stroke);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:3px 3px 0 var(--stroke);transition:transform .08s,box-shadow .08s}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stroke)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.block{width:100%;justify-content:center;padding:11px 12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:4px 6px}
.btn.ghost:hover{background:var(--accent-soft)}

.app{max-width:1500px;margin:0 auto;display:grid;gap:16px;
  grid-template-columns:250px minmax(0,1fr) 310px 290px;
  grid-template-areas:"files stage layers settings";align-items:start}
@media (max-width:1280px){.app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:"files files" "stage stage" "layers settings"}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);
  grid-template-areas:"files" "stage" "layers" "settings"}}

/* panels read as sticky notes: outlined card, coloured head strip, white numbered badge */
.panel{background:var(--panel);border:var(--sw) solid var(--stroke);border-radius:var(--r);min-width:0;overflow:hidden}
.panel h2{font:600 15px/1.2 var(--font-display);margin:0;letter-spacing:-.005em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;padding:10px 10px;border-bottom:var(--sw) solid var(--stroke);min-height:52px;background:var(--panel)}
.phead .count{margin-left:auto;white-space:nowrap;color:var(--fg);opacity:.7;font:12px var(--font-data)}
.n-blue .phead{background:var(--n-blue)} .n-pink .phead{background:var(--n-pink)}
.n-yellow .phead{background:var(--n-yellow)} .n-green .phead{background:var(--n-green)}
.step{display:grid;place-items:center;min-width:32px;height:32px;padding:0 5px;border-radius:5px;background:var(--badge-bg);color:var(--badge-fg);border:var(--sw) solid var(--stroke);font:700 14px var(--font-display);flex:none;font-variant-numeric:tabular-nums}
.pbody{padding:14px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.pbody>*{min-width:0}

/* files */
#files{grid-area:files}
.drop{position:relative;border:var(--sw) dashed var(--stroke);border-radius:10px;padding:22px 14px 18px;text-align:center;display:grid;gap:9px;justify-items:center;background:var(--panel);transition:background .15s}
.drop.over{background:var(--accent-soft)}
.drop svg{width:34px;height:34px;color:var(--fg)}
.drop strong{font-size:14px;font-weight:600}
.drop small{color:var(--muted);font-size:12px;line-height:1.5}
.filelist{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.file{min-width:0;display:flex;align-items:center;gap:10px;border:var(--sw) solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;background:var(--panel);text-align:left;width:100%}
.file:hover{border-color:var(--stroke)}
.file[aria-current="true"]{border-color:var(--stroke);background:var(--accent-soft);box-shadow:3px 3px 0 var(--accent)}
.ftag{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;font:600 10.5px var(--font-data);flex:none;background:#0d1b3d;color:#4fb3ff}
.ftag.ai{background:#3a1c00;color:#ff9a1f}
.file .meta{min-width:0;flex:1}
.file .name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px}
.file .sub{display:block;color:var(--muted);font:11.5px var(--font-data)}
.file .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:4px}
.file .x:hover{color:var(--bad);background:var(--hover)}
.note{position:relative;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.55;border:var(--sw) solid var(--stroke)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--fg)}
.note .close{position:absolute;top:6px;right:6px;border:0;background:none;color:inherit;cursor:pointer;opacity:.7;padding:2px 5px;border-radius:4px}
.note .close:hover{opacity:1;background:var(--hover)}
.badge{display:inline-block;font:600 10.5px var(--font-data);letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}

/* stage */
#stage{grid-area:stage;display:flex;flex-direction:column;min-height:440px;container-type:inline-size}
.tabs{display:flex;gap:2px;flex:none}
.tab{border:var(--sw) solid transparent;background:none;padding:3px 9px;border-radius:7px;cursor:pointer;color:var(--muted);font:500 13px var(--font-display)}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--stroke);background:var(--panel)}
.ratio{font:500 10.5px var(--font-data);background:var(--chip-bg);color:var(--chip-fg);border-radius:4px;padding:2px 6px;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.zoom{margin-left:auto;display:flex;align-items:center;gap:3px;font:11.5px var(--font-data);flex:none}
.zoom button{width:24px;height:24px;padding:0;border:var(--sw) solid var(--stroke);background:var(--panel);border-radius:6px;cursor:pointer;display:grid;place-items:center}
.zoom button:hover{background:var(--hover)}
.zoom output{min-width:38px;text-align:center}
/* the size chip gives way first when the preview panel is narrow, so the zoom controls stay on one line */
@container (max-width:400px){.ratio{display:none!important}}
.viewport{flex:1;overflow:auto;padding:22px;display:grid;place-items:center;min-height:380px;
  background-color:var(--check-2);
  background-image:linear-gradient(45deg,var(--check) 25%,transparent 25%),linear-gradient(-45deg,var(--check) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--check) 75%),linear-gradient(-45deg,transparent 75%,var(--check) 75%);
  background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.art{position:relative;outline:var(--sw) solid var(--stroke);outline-offset:0;line-height:0}
.art canvas{display:block;width:100%;height:100%}
.hl{position:absolute;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);pointer-events:none;box-shadow:0 0 0 9999px rgb(0 0 0 / .2)}
.hl span{position:absolute;left:-2px;bottom:100%;background:var(--accent);color:var(--accent-ink);font:600 11px/1.7 var(--font-ui);padding:0 7px;border-radius:4px 4px 0 0;white-space:nowrap}
.hl.alert{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 14%,transparent);box-shadow:none}
.hl.alert span{background:var(--alert);color:#fff}
.info{padding:18px;display:none}
.info dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0}
.info dt{color:var(--muted)}
.info dd{margin:0;font-family:var(--font-data);font-size:13px;word-break:break-all}
.info h3{font:600 14px var(--font-display);margin:22px 0 8px}
.info ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.empty-state{display:grid;gap:12px;justify-items:center;color:var(--muted);text-align:center;padding:24px}
.empty-state strong{color:var(--fg);font:600 15px var(--font-display)}

/* layers */
#layers{grid-area:layers;display:flex;flex-direction:column;max-height:calc(100vh - 110px);min-height:440px}
@media (max-width:1280px){#layers{max-height:560px}}
.tree{overflow:auto;flex:1;padding:6px;list-style:none;margin:0}
.tree ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px;cursor:default;min-height:38px;border:var(--sw) solid transparent}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-soft);border-color:var(--accent)}
.row.dim .lname{color:var(--muted)}
.row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
.twisty{width:18px;height:18px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);flex:none;display:grid;place-items:center;border-radius:4px}
.twisty:hover{background:var(--line)}
.twisty svg{width:12px;height:12px;transition:transform .15s}
.twisty[aria-expanded="false"] svg{transform:rotate(-90deg)}
.twisty.none{visibility:hidden}
.thumb{width:30px;height:30px;border-radius:5px;border:1px solid var(--line);flex:none;display:grid;place-items:center;overflow:hidden;
  background-color:var(--check-2);background-image:linear-gradient(45deg,var(--check) 25%,transparent 25%),linear-gradient(-45deg,var(--check) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--check) 75%),linear-gradient(-45deg,transparent 75%,var(--check) 75%);background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0}
.thumb canvas{max-width:100%;max-height:100%}
.thumb svg{width:16px;height:16px;color:var(--muted)}
.lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;cursor:pointer}
.ltag{font:10.5px var(--font-data);color:var(--muted);flex:none}
.ltag.style{font-family:var(--font-ui);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.mergebtn{flex:none;font:600 11px var(--font-ui);color:var(--fg);background:var(--panel);border:var(--sw) solid var(--stroke);border-radius:5px;padding:0 7px;line-height:20px;cursor:pointer}
.mergebtn:not(.on):hover:not(:disabled){background:var(--accent-soft)}
.mergebtn.on{background:var(--accent);color:var(--accent-ink)}
.mergebtn:disabled{cursor:default;opacity:.45}
.eye{color:var(--muted);flex:none;display:grid;place-items:center;width:18px}
.eye svg{width:14px;height:14px}
.tfoot{display:flex;gap:4px;padding:9px 12px;border-top:var(--sw) solid var(--stroke);flex-wrap:wrap}
.tfoot .sum{margin-left:auto;color:var(--muted);font:12px var(--font-data);align-self:center}

/* settings */
#settings{grid-area:settings}
.field{display:grid;gap:7px}
.field>label,.field>.lbl{font:600 13px var(--font-display)}
.field select{width:100%;border:var(--sw) solid var(--stroke);background:var(--panel);border-radius:8px;padding:8px 10px}
.field .hint{color:var(--muted);font-size:12px;line-height:1.45}
.checkrow{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.checkrow input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;flex:none}
.checkrow small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.radios{display:grid;gap:7px}
.colorrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.colorrow input{width:34px;height:26px;border:var(--sw) solid var(--stroke);border-radius:6px;padding:0;background:none}
.solist{margin:4px 0 0;padding-left:16px;font-size:12px;line-height:1.5;color:var(--alert);font-weight:500}
/* result: a green note pinned inside the export panel */
.result{border:var(--sw) solid var(--stroke);border-radius:10px;overflow:hidden}
.result .rhead{display:flex;align-items:center;gap:8px;background:var(--n-green);border-bottom:var(--sw) solid var(--stroke);padding:7px 10px;font:600 13px var(--font-display)}
.result .rhead .step{min-width:26px;height:26px;font-size:12px}
.outinfo{font:12px/1.65 var(--font-data);color:var(--muted);padding:9px 11px;word-break:break-word}
.outinfo b{color:var(--fg);font-weight:500}
.actions{display:grid;gap:9px}
.progress{height:8px;border-radius:99px;border:var(--sw) solid var(--stroke);background:var(--panel);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.status{font-size:12.5px;color:var(--muted);min-height:1.5em}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}

/* export preview */
dialog{border:var(--sw) solid var(--stroke);border-radius:14px;background:var(--panel);color:var(--fg);padding:0;width:min(1000px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgb(8 14 28 / .55)}
.dhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:var(--sw) solid var(--stroke);position:sticky;top:0;background:var(--n-green);z-index:1}
.dhead h2{font:600 16px var(--font-display);margin:0}
.dhead .count{color:var(--fg);opacity:.7;font:12px var(--font-data)}
.dhead .btn:last-child{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:16px 18px 20px;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.card{border:var(--sw) solid var(--stroke);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--panel)}
.card .pic{position:relative;aspect-ratio:1;overflow:hidden;max-width:100%;border-bottom:var(--sw) solid var(--stroke);
  background-color:var(--check-2);background-image:linear-gradient(45deg,var(--check) 25%,transparent 25%),linear-gradient(-45deg,var(--check) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--check) 75%),linear-gradient(-45deg,transparent 75%,var(--check) 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}
.card img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain}
.card .pic .ratio{position:absolute;left:6px;top:6px;font-size:10.5px;padding:1px 6px;z-index:1}
.card .cap{padding:8px 10px;display:grid;gap:2px;min-width:0}
.card .fn{font:600 13px var(--font-data);word-break:break-all}
.card .ln,.card .dim{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dim{font-family:var(--font-data)}
.card .sonote{font-size:11px;line-height:1.4;color:var(--alert);background:var(--alert-bg);border-radius:4px;padding:3px 5px;margin-top:3px;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/><path d="m2 17.5 10 5 10-5" opacity=".6"/></svg></div>
  <div><h1>Layer Splitter</h1></div>
  <input type="file" id="fileInput" accept=".psd,.psb,.ai" multiple hidden>
</header>

<main class="app">
  <!-- FILES -->
  <section class="panel n-blue" id="files" aria-label="ไฟล์">
    <div class="phead"><span class="step">01</span><h2>เลือกไฟล์</h2></div>
    <div class="pbody">
    <div class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5"/><path d="M12 12v8M8.5 15.5 12 12l3.5 3.5"/></svg>
      <button class="btn primary" id="browseBtn" type="button">เลือกไฟล์</button>
      <small>ไฟล์ไม่ถูกส่งออกจากเครื่อง ทุกอย่างประมวลผลในเบราว์เซอร์<br>ไฟล์ใหญ่หลาย GB ขึ้นกับหน่วยความจำของเครื่อง</small>
    </div>
    <div class="filelist" id="fileList"></div>
    <div id="fileNote"></div>
    </div>
  </section>

  <!-- STAGE -->
  <section class="panel" id="stage" aria-label="ตัวอย่าง">
    <div class="phead">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" id="tabPreview" type="button">Preview</button>
        <button class="tab" role="tab" aria-selected="false" id="tabInfo" type="button">Info</button>
      </div>
      <span class="ratio" id="ratioChip" hidden></span>
      <div class="zoom" id="zoomBox">
        <button type="button" id="zOut" aria-label="ซูมออก">−</button>
        <output id="zVal">100%</output>
        <button type="button" id="zIn" aria-label="ซูมเข้า">+</button>
        <button type="button" id="zFit" aria-label="พอดีกรอบ" title="พอดีกรอบ"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <div class="viewport" id="viewport"><div class="empty-state">ยังไม่มีไฟล์</div></div>
    <div class="info" id="info"></div>
  </section>

  <!-- LAYERS -->
  <section class="panel n-yellow" id="layers" aria-label="Layers">
    <div class="phead"><span class="step">02</span><h2>เลือก Layer</h2><span class="count" id="layerCount">0 layers</span></div>
    <ul class="tree" id="tree" role="tree"></ul>
    <div class="tfoot">
      <span class="sum" id="selSum"></span>
    </div>
  </section>

/* ---------- export ---------- */

async function renderPlan(onItem) {

        catch (e) { console.error(e); note = "Smart Object: ดึงความละเอียดเต็มไม่สำเร็จ ใช้ภาพตาม canvas แทน"; }
      }

    if (grp && st.so === "original" && groupSos(n).length) note = "Smart Object ในกรุ๊ปที่รวมใช้ภาพตาม canvas";
    if (!c) c = renderNode(d, n, st);

}

/* ---------- wiring ---------- */
function renderAll() { renderFiles(); renderStage(); renderInfo(); renderTree(); renderOutInfo(); showTab(S.tab); }
function showTab(t) { S.tab = t; $("#tabPreview").setAttribute("aria-selected", t === "preview"); $("#tabInfo").setAttribute("aria-selected", t === "info"); $("#viewport").style.display = t === "preview" ? "" : "none"; $("#info").style.display = t === "info" ? "block" : "none"; $("#zoomBox").style.visibility = t === "preview" ? "" : "hidden"; if (t === "preview") applyZoom(); }

$("#tabPreview").onclick = () => showTab("preview");
$("#tabInfo").onclick = () => showTab("info");
$("#zIn").onclick = () => { S.fit = false; S.zoom = Math.min(4, S.zoom * 1.25); applyZoom(); };
$("#zOut").onclick = () => { S.fit = false; S.zoom = Math.max(0.05, S.zoom / 1.25); applyZoom(); };
$("#zFit").onclick = () => { S.fit = true; applyZoom(); };
window.addEventListener("resize", () => { if (S.fit) applyZoom(); });
$("#browseBtn").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) { dropSample(); addFiles(fs); } };
const drop = $("#drop");
["dragenter", "dragover"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); if (t === "drop" || e.target === document.documentElement) drop.classList.remove("over"); }));
document.addEventListener("drop", e => { const fs = [...(e.dataTransfer && e.dataTransfer.files || [])]; if (fs.length) { dropSample(); addFiles(fs); } });
function dropSample() { const i = S.docs.findIndex(d => d.sample); if (i >= 0) { S.docs.splice(i, 1); S.active = S.docs.length - 1; } }
$("#dpi").addEventListener("change", renderOutInfo);
$("#fx").addEventListener("change", () => { renderOutInfo(); renderStage(); });
document.querySelectorAll("input[name=so]").forEach(r => r.addEventListener("change", () => { renderOutInfo(); renderStage(); }));
$("#transparent").addEventListener("change", () => { $("#bgRow").hidden = $("#transparent").checked; renderOutInfo(); });
$("#splitBtn").onclick = doSplit;
$("#previewBtn").onclick = doPreview;
$("#dlgClose").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("close", () => $("#dlgGrid").querySelectorAll("img").forEach(i => URL.revokeObjectURL(i.src)));

if (typeof agPsd === "undefined" || typeof JSZip === "undefined") setStatus("โหลดไลบรารีไม่สำเร็จ ตรวจการเชื่อมต่ออินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่", "bad");
S.docs.push(sampleDoc()); S.active = 0;
renderAll();
window.__ls = { S, plan, settings, addFiles };
})();
</script>
